# Build uYouPlus as an unsigned IPA for sideloading with AltStore.
# Adapted from .github/workflows/buildapp.yml (qnblackcat/uYouPlus).
# AltStore will re-sign the IPA on-device with the user's personal Apple ID,
# so no code signing credentials are needed here.
workflows:
  build-uYouPlus:
    name: Build uYouPlus (AltStore IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        # Direct URL of a decrypted YouTube IPA. The build detects the
        # YouTube version from the IPA itself and overrides the Makefile default.
        YOUTUBE_URL: "https://files.catbox.moe/5a8qlt.ipa"
        # uYou deb source (required: Makefile's `-n $(UYOU_URL)` test breaks
        # when this is empty, and this URL is the fallback used by the repo).
        UYOU_URL: "https://repo.miro92.com/debs/com.miro.uyou_3.0.4_iphoneos-arm.deb"
      xcode: latest
    scripts:
      - name: Checkout submodules
        script: |
          set -e
          git submodule update --init --recursive

      - name: Install dependencies
        script: |
          set -e
          brew install ldid dpkg make

      - name: Setup Theos
        script: |
          set -e
          export THEOS="$CM_BUILD_DIR/theos"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          # Patched iOS 16.5 SDK (with private frameworks)
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Setup Theos Jailed
        script: |
          set -e
          export THEOS="$CM_BUILD_DIR/theos"
          echo "THEOS=$THEOS" >> "$CM_ENV"
          git clone --depth 1 --recursive https://github.com/qnblackcat/theos-jailed.git "$CM_BUILD_DIR/theos-jailed"
          cd "$CM_BUILD_DIR/theos-jailed"
          ./install

      - name: Prepare YouTube IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -L --fail --silent --show-error "$YOUTUBE_URL" -o YouTube.ipa
          unzip -q YouTube.ipa
          YT_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/YouTube.app/Info.plist)"
          echo "==> YouTube v$YT_VERSION downloaded!"
          echo "YOUTUBE_VERSION=$YT_VERSION" >> "$CM_ENV"

      - name: Build package
        script: |
          set -e
          export THEOS="$CM_BUILD_DIR/theos"
          # Theos requires GNU make >= 4.x
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          cd "$CM_BUILD_DIR"
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1
          echo "==> SHASUM256: $(shasum -a 256 packages/*.ipa | cut -f1 -d' ')"
          echo "==> Bundle ID: com.google.ios.youtube"

    artifacts:
      - packages/*.ipa

    publishing:
      email:
        recipients:
          - spuro982@gmail.com
        notify:
          success: true
          failure: true
